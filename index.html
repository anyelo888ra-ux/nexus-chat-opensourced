<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusChat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'gg sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #313338;
      color: #f2f3f5;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* --- PANTALLA DE AUTH (LOGIN / REGISTER) --- */
    #auth-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #1e1f22;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .auth-card {
      background: #2b2d31;
      padding: 32px;
      border-radius: 8px;
      width: 400px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .auth-card h2 {
      text-align: center;
      margin-bottom: 8px;
      color: #f2f3f5;
    }

    .auth-card p {
      text-align: center;
      color: #b5bac1;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      color: #b5bac1;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      background: #1e1f22;
      border: 1px solid #111214;
      border-radius: 4px;
      color: #fff;
      outline: none;
    }

    .auth-btn {
      width: 100%;
      padding: 12px;
      background: #5865f2;
      border: none;
      border-radius: 4px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .auth-btn:hover {
      background: #4752c4;
    }

    /* --- INTERFAZ PRINCIPAL DE NEXUSCHAT --- */
    #app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    /* 1. BARRA DE SERVIDORES */
    .servers-bar {
      width: 72px;
      background-color: #1e1f22;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 12px;
      gap: 8px;
    }

    .server-icon {
      width: 48px;
      height: 48px;
      background-color: #313338;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    .server-icon:hover {
      border-radius: 16px;
      background-color: #5865f2;
    }

    .add-server-btn {
      background-color: #313338;
      color: #23a55a;
      font-size: 24px;
    }

    .add-server-btn:hover {
      background-color: #23a55a;
      color: #fff;
    }

    /* 2. BARRA DE CANALES */
    .channels-bar {
      width: 240px;
      background-color: #2b2d31;
      display: flex;
      flex-direction: column;
    }

    .server-header {
      height: 48px;
      border-bottom: 1px solid #1f2023;
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-weight: bold;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }

    .channel-list {
      padding: 12px 8px;
      flex-grow: 1;
    }

    .channel-item {
      padding: 6px 8px;
      border-radius: 4px;
      color: #949ba4;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }

    .channel-item:hover, .channel-item.active {
      background-color: #35373c;
      color: #f2f3f5;
    }

    /* 3. ÁREA DE CHAT */
    .chat-area {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      background-color: #313338;
    }

    .chat-header {
      height: 48px;
      border-bottom: 1px solid #26282c;
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-weight: bold;
      gap: 8px;
    }

    .messages-container {
      flex-grow: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      display: flex;
      gap: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #5865f2;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
    }

    .message-content h4 {
      font-size: 14px;
      color: #f2f3f5;
    }

    .message-content p {
      font-size: 14px;
      color: #dbdee1;
      margin-top: 4px;
    }

    .input-box {
      padding: 16px;
    }

    .input-box input {
      width: 100%;
      padding: 12px 16px;
      background-color: #383a40;
      border: none;
      border-radius: 8px;
      color: #f2f3f5;
      outline: none;
    }

    /* 4. LISTA DE MIEMBROS */
    .members-bar {
      width: 240px;
      background-color: #2b2d31;
      padding: 16px 8px;
    }

    .members-title {
      font-size: 12px;
      font-weight: bold;
      color: #949ba4;
      text-transform: uppercase;
      margin-bottom: 8px;
      padding-left: 8px;
    }

    .member-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 4px;
      color: #949ba4;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- PANTALLA DE LOGIN / REGISTRO -->
  <div id="auth-screen">
    <div class="auth-card">
      <h2>¡Te damos la bienvenida a NexusChat!</h2>
      <p>Inicia sesión o crea un usuario para empezar.</p>
      <div class="form-group">
        <label>Nombre de Usuario</label>
        <input type="text" id="username-input" placeholder="Tu apodo">
      </div>
      <button class="auth-btn" onclick="login()">Entrar a NexusChat</button>
    </div>
  </div>

  <!-- INTERFAZ PRINCIPAL -->
  <div id="app-container" class="hidden">
    
    <!-- Servidores -->
    <div class="servers-bar">
      <div class="server-icon" title="Inicio">N</div>
      <hr style="width: 32px; border: 1px solid #35373c;">
      <div class="server-icon active" title="Servidor Principal">GS</div>
      <div class="server-icon add-server-btn" onclick="createServer()" title="Crear Servidor">+</div>
    </div>

    <!-- Canales -->
    <div class="channels-bar">
      <div class="server-header" id="current-server-name">Comunidad Nexus</div>
      <div class="channel-list">
        <div class="channel-item active"># general</div>
        <div class="channel-item"># memes</div>
      </div>
    </div>

    <!-- Chat principal -->
    <div class="chat-area">
      <div class="chat-header">
        <span style="color: #80848e;">#</span>
        <span id="current-channel-name">general</span>
      </div>
      
      <div class="messages-container" id="messages-box">
        <div class="message">
          <div class="avatar">SYS</div>
          <div class="message-content">
            <h4>NexusBot</h4>
            <p>¡Bienvenido a NexusChat! Este es el canal general.</p>
          </div>
        </div>
      </div>

      <div class="input-box">
        <input type="text" id="chat-input" placeholder="Enviar mensaje a #general..." onkeypress="handleKeyPress(event)">
      </div>
    </div>

    <!-- Lista de miembros -->
    <div class="members-bar">
      <div class="members-title">En línea — 1</div>
      <div class="member-item">
        <div class="avatar" style="width: 32px; height: 32px; font-size: 12px;">U</div>
        <span id="user-display-name">Usuario</span>
      </div>
    </div>

  </div>

  <script>
    let currentUser = "";

    function login() {
      const input = document.getElementById("username-input").value.trim();
      if (input !== "") {
        currentUser = input;
        document.getElementById("user-display-name").innerText = currentUser;
        document.getElementById("auth-screen").classList.add("hidden");
        document.getElementById("app-container").classList.remove("hidden");
      }
    }

    function handleKeyPress(e) {
      if (e.key === "Enter") {
        const input = document.getElementById("chat-input");
        const msg = input.value.trim();
        if (msg !== "") {
          addMessage(currentUser, msg);
          input.value = "";
        }
      }
    }

    function addMessage(user, text) {
      const box = document.getElementById("messages-box");
      const msgDiv = document.createElement("div");
      msgDiv.className = "message";
      msgDiv.innerHTML = `
        <div class="avatar">${user.substring(0, 2).toUpperCase()}</div>
        <div class="message-content">
          <h4>${user}</h4>
          <p>${text}</p>
        </div>
      `;
      box.appendChild(msgDiv);
      box.scrollTop = box.scrollHeight;
    }

    function createServer() {
      const serverName = prompt("Nombre del nuevo servidor:");
      if (serverName) {
        alert("Servidor local '" + serverName + "' creado.");
      }
    }
  </script>
</body>
</html>
