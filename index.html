<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusChat</title>
  <!-- PeerJS para conexiones P2P en tiempo real -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'gg sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #313338;
      color: #f2f3f5;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* PANTALLA DE LOGIN */
    #auth-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #1e1f22;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .auth-card {
      background: #2b2d31;
      padding: 32px;
      border-radius: 8px;
      width: 400px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .auth-card h2 {
      text-align: center;
      margin-bottom: 8px;
      color: #f2f3f5;
    }

    .auth-card p {
      text-align: center;
      color: #b5bac1;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      color: #b5bac1;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      background: #1e1f22;
      border: 1px solid #111214;
      border-radius: 4px;
      color: #fff;
      outline: none;
    }

    .auth-btn {
      width: 100%;
      padding: 12px;
      background: #5865f2;
      border: none;
      border-radius: 4px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .auth-btn:hover {
      background: #4752c4;
    }

    /* INTERFAZ PRINCIPAL */
    #app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    .servers-bar {
      width: 72px;
      background-color: #1e1f22;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 12px;
      gap: 8px;
    }

    .server-icon {
      width: 48px;
      height: 48px;
      background-color: #313338;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    .server-icon:hover, .server-icon.active {
      border-radius: 16px;
      background-color: #5865f2;
    }

    .add-btn { background-color: #23a55a; color: #fff; }
    .join-btn { background-color: #4752c4; color: #fff; }

    .channels-bar {
      width: 240px;
      background-color: #2b2d31;
      display: flex;
      flex-direction: column;
    }

    .server-header {
      height: 48px;
      border-bottom: 1px solid #1f2023;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 16px;
      font-weight: bold;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }

    .server-id-sub {
      font-size: 10px;
      color: #949ba4;
      font-weight: normal;
      user-select: all;
    }

    .channel-list { padding: 12px 8px; flex-grow: 1; }

    .channel-item {
      padding: 6px 8px;
      border-radius: 4px;
      color: #949ba4;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .channel-item.active { background-color: #35373c; color: #f2f3f5; }

    .chat-area {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      background-color: #313338;
    }

    .chat-header {
      height: 48px;
      border-bottom: 1px solid #26282c;
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-weight: bold;
    }

    .messages-container {
      flex-grow: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message { display: flex; gap: 12px; }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #5865f2;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
    }

    .message-content h4 { font-size: 14px; color: #f2f3f5; }
    .message-content p { font-size: 14px; color: #dbdee1; margin-top: 4px; }

    .input-box { padding: 16px; }

    .input-box input {
      width: 100%;
      padding: 12px 16px;
      background-color: #383a40;
      border: none;
      border-radius: 8px;
      color: #f2f3f5;
      outline: none;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- PANTALLA DE LOGIN -->
  <div id="auth-screen">
    <div class="auth-card">
      <h2>¡Bienvenido a NexusChat!</h2>
      <p>Ingresa tu apodo para chatear en vivo.</p>
      <div class="form-group">
        <label>Nombre de usuario</label>
        <input type="text" id="username-input" placeholder="Tu apodo">
      </div>
      <button class="auth-btn" onclick="login()">Entrar a NexusChat</button>
    </div>
  </div>

  <!-- INTERFAZ PRINCIPAL -->
  <div id="app-container" class="hidden">
    
    <!-- Servidores -->
    <div class="servers-bar" id="servers-bar">
      <div class="server-icon active" title="Inicio">N</div>
      <hr style="width: 32px; border: 1px solid #35373c;">
      <div class="server-icon add-btn" onclick="createNewServer()" title="Crear Servidor">+</div>
      <div class="server-icon join-btn" onclick="joinExistingServer()" title="Unirse con ID">🔗</div>
    </div>

    <!-- Canales -->
    <div class="channels-bar">
      <div class="server-header">
        <span id="current-server-name">Servidor Local</span>
        <span id="current-server-id" class="server-id-sub">ID: Ninguno</span>
      </div>
      <div class="channel-list">
        <div class="channel-item active"># general</div>
      </div>
    </div>

    <!-- Area de Chat -->
    <div class="chat-area">
      <div class="chat-header">
        <span style="color: #80848e;">#</span>
        <span>general</span>
      </div>
      
      <div class="messages-container" id="messages-box">
        <div class="message">
          <div class="avatar">NX</div>
          <div class="message-content">
            <h4>NexusBot</h4>
            <p>¡Bienvenido a NexusChat! Haz clic en '+' para crear un servidor o en '🔗' para unirte al servidor de un amigo usando su ID.</p>
          </div>
        </div>
      </div>

      <div class="input-box">
        <input type="text" id="chat-input" placeholder="Enviar mensaje..." onkeypress="handleKeyPress(event)">
      </div>
    </div>

  </div>

  <script>
    let currentUser = "";
    let peer = null;
    let connections = []; // Guardará las conexiones activas P2P

    function login() {
      const input = document.getElementById("username-input").value.trim();
      if (input !== "") {
        currentUser = input;
        document.getElementById("auth-screen").classList.add("hidden");
        document.getElementById("app-container").classList.remove("hidden");
      }
    }

    // CREAR UN SERVIDOR (El usuario actual se convierte en el Host)
    function createNewServer() {
      const serverName = prompt("Nombre del servidor:");
      if (!serverName) return;

      const randomId = "nexus-" + Math.random().toString(36).substring(2, 8);
      peer = new Peer(randomId);

      peer.on('open', (id) => {
        document.getElementById("current-server-name").innerText = serverName;
        document.getElementById("current-server-id").innerText = "ID: " + id;
        addMessage("NexusBot", `Servidor '${serverName}' creado. Comparte el ID: ${id} para que tus amigos se unan.`);
      });

      peer.on('connection', (conn) => {
        connections.push(conn);
        conn.on('data', (data) => {
          addMessage(data.user, data.msg);
          // Reenviar mensaje a los demás conectados
          connections.forEach(c => {
            if (c !== conn) c.send(data);
          });
        });
      });
    }

    // UNIRSE A UN SERVIDOR EXISTENTE CON SU ID
    function joinExistingServer() {
      const serverId = prompt("Pega el ID del servidor al que deseas unirte:");
      if (!serverId) return;

      peer = new Peer();

      peer.on('open', () => {
        const conn = peer.connect(serverId);
        conn.on('open', () => {
          connections.push(conn);
          document.getElementById("current-server-name").innerText = "Servidor Conectado";
          document.getElementById("current-server-id").innerText = "ID: " + serverId;
          addMessage("NexusBot", "¡Conectado exitosamente al servidor!");
        });

        conn.on('data', (data) => {
          addMessage(data.user, data.msg);
        });
      });
    }

    function handleKeyPress(e) {
      if (e.key === "Enter") {
        const input = document.getElementById("chat-input");
        const msg = input.value.trim();
        if (msg !== "") {
          addMessage(currentUser, msg);
          
          // Transmitir mensaje por PeerJS
          connections.forEach(conn => {
            conn.send({ user: currentUser, msg: msg });
          });

          input.value = "";
        }
      }
    }

    function addMessage(user, text) {
      const box = document.getElementById("messages-box");
      const msgDiv = document.createElement("div");
      msgDiv.className = "message";
      msgDiv.innerHTML = `
        <div class="avatar">${user.substring(0, 2).toUpperCase()}</div>
        <div class="message-content">
          <h4>${user}</h4>
          <p>${text}</p>
        </div>
      `;
      box.appendChild(msgDiv);
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
